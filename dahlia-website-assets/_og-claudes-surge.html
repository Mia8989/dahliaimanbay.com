<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OG Image Generator -- Claude's Surge Blog Post</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&family=Sora:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .og-canvas {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #F0ECF6 0%, #FFF9F5 50%, #E8F5F7 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  /* Decorative circle top-right */
  .og-canvas::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(42, 123, 136, 0.08);
  }

  /* Decorative circle bottom-left */
  .og-canvas::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -60px;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(184, 169, 212, 0.12);
  }

  .og-content {
    display: flex;
    align-items: center;
    gap: 60px;
    padding: 60px 80px;
    position: relative;
    z-index: 2;
    width: 100%;
  }

  .og-photo-wrap {
    flex-shrink: 0;
    position: relative;
  }

  .og-photo {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    border: 6px solid #B8A9D4;
    box-shadow: 0 8px 32px rgba(123, 45, 59, 0.15);
  }

  /* Stat badge floating on photo */
  .og-stat-badge {
    position: absolute;
    bottom: -10px;
    right: -20px;
    background: linear-gradient(135deg, #2A7B88, #8E7BB8);
    border-radius: 14px;
    padding: 12px 18px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .og-stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 30px;
    color: white;
    display: block;
    line-height: 1;
  }
  .og-stat-lbl {
    font-family: 'Sora', sans-serif;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 1px;
    display: block;
    margin-top: 3px;
  }

  .og-text {
    flex: 1;
  }

  .og-tag {
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #2A7B88;
    margin-bottom: 18px;
  }

  .og-title {
    font-family: 'DM Serif Display', serif;
    font-size: 43px;
    line-height: 1.2;
    color: #7B2D3B;
    margin-bottom: 28px;
  }

  .og-author {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    color: #6B5B6E;
    font-weight: 500;
  }

  .og-author strong {
    color: #7B2D3B;
    font-weight: 600;
  }

  /* Bottom accent bar */
  .og-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #2A7B88, #B8A9D4, #7B2D3B);
    z-index: 3;
  }

  /* Site URL watermark */
  .og-url {
    position: absolute;
    bottom: 22px;
    right: 40px;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: rgba(42, 123, 136, 0.5);
    letter-spacing: 1px;
    z-index: 3;
  }
</style>
</head>
<body style="background: #ddd; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

<div class="og-canvas">
  <div class="og-content">
    <div class="og-photo-wrap">
      <img class="og-photo" src="/Users/dahlia.imanbay/dahlia-ai-brain/brands/AI_Powered_Dahlia/website/dahlia-website-assets/newphoto.jpg" alt="Dahlia Imanbay">
      <div class="og-stat-badge">
        <span class="og-stat-num">3x</span>
        <span class="og-stat-lbl">Claude DAU growth</span>
      </div>
    </div>
    <div class="og-text">
      <div class="og-tag">AI Tools &amp; Strategy</div>
      <h1 class="og-title">I've Been Building on Claude for a Year. Here's Why the Numbers Don't Surprise Me.</h1>
      <p class="og-author">by <strong>Dahlia Imanbay</strong></p>
    </div>
  </div>
  <div class="og-bar"></div>
  <div class="og-url">dahliaimanbay.com</div>
</div>

</body>
</html>
