<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&family=Sora:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#FFF9F5;font-family:'Inter',sans-serif;position:relative}
.left{position:absolute;left:64px;top:96px;width:600px}
.tag{font-family:'Sora',sans-serif;font-size:17px;letter-spacing:4px;text-transform:uppercase;color:#2A7B88;margin-bottom:26px}
h1{text-wrap:balance;font-family:'DM Serif Display',serif;font-size:64px;line-height:1.08;color:#7B2D3B;margin-bottom:28px}
h1 em{font-style:normal;color:#2A7B88}
p{font-size:25px;line-height:1.45;color:#2C2C2C}
.foot{position:absolute;left:64px;bottom:52px;font-family:'Sora',sans-serif;font-size:18px;letter-spacing:2px;color:#7B2D3B;text-transform:uppercase}
.foot b{color:#8E7BB8}
.card{position:absolute;right:56px;top:132px;width:470px;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(123,45,59,.18);padding:30px 32px;transform:rotate(1.5deg)}
.row{font-size:17px;color:#6B6B6B;margin-bottom:8px}
.line{height:12px;border-radius:6px;background:#F0ECF6;margin:14px 0}
.msg{font-size:21px;line-height:1.5;color:#2C2C2C;margin:18px 0 14px}
.link{display:inline-block;background:#F2C4C4;color:#5C1F2B;font-weight:600;font-size:20px;padding:12px 20px;border-radius:999px}
.draft{position:absolute;top:-18px;left:28px;background:#2A7B88;color:#fff;font-family:'Sora',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border-radius:999px}
.blob{position:absolute;right:-80px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:#F0ECF6}
</style></head>
<body>
<div class="blob"></div>
<div class="left">
  <div class="tag">30 Hacks &bull; Hack 35</div>
  <h1>Your booking link in <em>every</em> email reply</h1>
  <p>A 5-step Gmail flow with Gemini,<br>plus prompts you can copy.</p>
</div>
<div class="card">
  <span class="draft">Draft ready</span>
  <div class="row">Re: Can we talk next week?</div>
  <div class="line" style="width:90%"></div>
  <div class="msg">Happy to help with this. Grab any time that works for you here:</div>
  <span class="link">&#128197; Book a call with me</span>
  <div class="line" style="width:60%;margin-top:22px"></div>
  <div class="line" style="width:40%"></div>
</div>
<div class="foot">Dahlia Imanbay <b>&bull;</b> dahliaimanbay.com</div>
</body></html>
